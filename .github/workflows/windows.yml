name: Windows build and integration tests
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '.github/workflows/release-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Test, publish and smoke test
        env:
          AIINPUT_CI_GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./build.ps1
      - name: Upload installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: AiInputAssistant-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/smoke.txt
            artifacts/smoke.txt.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-locks
          path: '**/packages.lock.json'
          if-no-files-found: ignore
