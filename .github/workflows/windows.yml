name: Windows v1.0 build
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Test, publish and smoke test
        shell: pwsh
        run: ./build.ps1
      - name: Upload installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: AiInputAssistant-1.0.0-win-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/smoke.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-locks
          path: '**/packages.lock.json'
          if-no-files-found: ignore
